# Release: build the agent and the installer on Windows, the extension zips on
# Linux, sign the Windows files through SignPath Foundation once signing is set
# up, and publish a GitHub release with them.
#
# Runs on a version tag (v0.1.0), or by hand (Actions, release, Run workflow)
# for a tag that already exists.
#
# Signing starts when the repository has the variables SIGNPATH_ORGANIZATION_ID
# and SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN (SignPath project
# with the signing policy "release-signing" and the artifact configurations
# "agent" and "installer"). Without them the release is built unsigned and says so.
# Every job runs on GitHub-hosted runners, as SignPath's open-source checks require.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}

jobs:
  # Build and sign with read-only tokens; only the publish job may write.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Version from the tag
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" ext/manifest.json || { echo "ext/manifest.json version is not $v"; exit 1; }
          echo "KG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build and test the agent, with the Windows file details
        run: KG_WINRES=1 bash tools/build-agent.sh

      - name: Upload the agent for signing
        id: agent-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-unsigned
          path: dist/raisesteady-guard-agent-*.exe

      - name: Sign the agent (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: agent
          github-artifact-id: ${{ steps.agent-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-agent

      - name: Use the signed agent in the installer
        if: env.SIGN == 'true'
        run: cp dist/signed-agent/raisesteady-guard-agent-*.exe dist/

      - name: Build the installer
        run: bash tools/build-installer.sh --skip-agent

      - name: Upload the installer for signing
        id: installer-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/RaiseSteadyGuardSetup.exe

      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: cp dist/signed-installer/RaiseSteadyGuardSetup.exe dist/RaiseSteadyGuardSetup.exe

      - name: Keep the installer for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: dist/RaiseSteadyGuardSetup.exe
          if-no-files-found: error

  # The extension build calls zip, which Linux runners have and Windows runners do not.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the extension zips
        run: |
          grep -q "\"version\": \"${TAG#v}\"" ext/manifest.json || { echo "ext/manifest.json version is not ${TAG#v}"; exit 1; }
          node tools/build-ext.mjs

      - name: Keep the zips for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: extension-files
          path: |
            dist/raisesteady-guard-*-chromium.zip
            dist/raisesteady-guard-*-firefox.zip
          if-no-files-found: error

  publish:
    needs: [windows, extension]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-files"
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum RaiseSteadyGuardSetup.exe raisesteady-guard-*-chromium.zip raisesteady-guard-*-firefox.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          home="https://github.com/$GH_REPO"
          {
            echo "RaiseSteady Guard ${TAG#v}: free, open-source child-safe browsing for Windows."
            echo
            echo "Download \`RaiseSteadyGuardSetup.exe\` and run it; Windows asks for an administrator. What it does, its limits and privacy: [README]($home#readme)."
            echo
            if [ "$SIGN" = true ]; then
              echo "**[Code signing policy]($home#code-signing-policy):** Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)."
            else
              echo "**[Code signing policy]($home#code-signing-policy):** these files are not code-signed yet; free signing through SignPath Foundation is planned. Windows may show \"Windows protected your PC\": click More info, then Run anyway."
            fi
            echo
            echo "The extension zips are the store packages, also for testing. On a home PC the extension installs from the browser stores once it is published there."
            echo
            echo "Checksums: SHA256SUMS.txt."
          } > notes.md
          gh release create "$TAG" --verify-tag --title "RaiseSteady Guard ${TAG#v}" --notes-file notes.md \
            RaiseSteadyGuardSetup.exe raisesteady-guard-*-chromium.zip raisesteady-guard-*-firefox.zip SHA256SUMS.txt
