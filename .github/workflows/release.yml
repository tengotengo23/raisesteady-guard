# Release: build the agent and the installer on Windows, the extension zips and
# the Linux packages (.deb, .rpm, .tar.gz) on Linux, the Android app (APK), sign the Windows files through SignPath Foundation once signing is set
# up, and publish a GitHub release with them.
#
# Runs on a version tag (v0.1.0), or by hand (Actions, release, Run workflow)
# for a tag that already exists.
#
# Signing starts when the repository has the variables SIGNPATH_ORGANIZATION_ID
# and SIGNPATH_PROJECT_SLUG and the secret SIGNPATH_API_TOKEN (SignPath project
# with the signing policy "release-signing" and the artifact configurations
# "agent" and "installer"). Without them the release is built unsigned and says so.
#
# The Android APK is signed only when the repository has the four secrets ANDROID_KEYSTORE_B64
# (the PKCS12 keystore, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD; the key file lives in $RUNNER_TEMP for the build only. Without them the
# APK is built and tested for the record but not attached, and the notes say so.
# Every job runs on GitHub-hosted runners, as SignPath's open-source checks require.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}

jobs:
  # Build and sign with read-only tokens; only the publish job may write.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Version from the tag
        run: |
          v="${TAG#v}"
          grep -q "\"version\": \"$v\"" ext/manifest.json || { echo "ext/manifest.json version is not $v"; exit 1; }
          echo "KG_VERSION=$v" >> "$GITHUB_ENV"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build and test the agent, with the Windows file details
        run: KG_WINRES=1 bash tools/build-agent.sh

      - name: Upload the agent for signing
        id: agent-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-unsigned
          path: dist/raisesteady-guard-agent-*.exe

      - name: Sign the agent (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: agent
          github-artifact-id: ${{ steps.agent-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-agent

      - name: Use the signed agent in the installer
        if: env.SIGN == 'true'
        run: cp dist/signed-agent/raisesteady-guard-agent-*.exe dist/

      - name: Build the installer
        run: bash tools/build-installer.sh --skip-agent

      - name: Upload the installer for signing
        id: installer-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/RaiseSteadyGuardSetup.exe

      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: cp dist/signed-installer/RaiseSteadyGuardSetup.exe dist/RaiseSteadyGuardSetup.exe

      - name: Keep the installer for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: windows-files
          path: dist/RaiseSteadyGuardSetup.exe
          if-no-files-found: error

  # The extension build calls zip, which Linux runners have and Windows runners do not.
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the extension zips
        run: |
          grep -q "\"version\": \"${TAG#v}\"" ext/manifest.json || { echo "ext/manifest.json version is not ${TAG#v}"; exit 1; }
          node tools/build-ext.mjs

      - name: Keep the zips for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: extension-files
          path: |
            dist/raisesteady-guard-*-chromium.zip
            dist/raisesteady-guard-*-firefox.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check the tag
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: nFPM (packages), pinned
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build and test the Linux program and packages
        run: |
          grep -q "\"version\": \"${TAG#v}\"" ext/manifest.json || { echo "ext/manifest.json version is not ${TAG#v}"; exit 1; }
          KG_VERSION="${TAG#v}" NFPM="$(go env GOPATH)/bin/nfpm" bash tools/build-linux.sh

      - name: Keep the packages for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: linux-files
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Check the tag
        working-directory: .
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: The release key (only when the four secrets exist)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/guard-release.p12"
          echo "GUARD_KEYSTORE=$RUNNER_TEMP/guard-release.p12" >> "$GITHUB_ENV"

      - name: Unit tests, lint and the release APK
        env:
          GUARD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GUARD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GUARD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/guard-release.p12"

      - name: Check the signature, write the checksum and the certificate fingerprint
        if: env.HAS_KEY == 'true'
        run: |
          apk="$(ls app/build/outputs/apk/release/raisesteady-guard-android-*.apk)"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          fp="$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [ -n "$fp" ] || { echo "the APK is not signed"; exit 1; }
          mkdir -p ../dist
          cp "$apk" ../dist/
          echo "$fp" > ../dist/android-certificate-sha256.txt
          echo "Certificate SHA-256: $fp"

      - name: Keep the APK for the publish job
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-files
          path: |
            dist/raisesteady-guard-android-*.apk
            dist/android-certificate-sha256.txt
          if-no-files-found: error

      - name: Keep the unsigned APK for the record (not attached to the release)
        if: env.HAS_KEY != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/
          retention-days: 30

  publish:
    needs: [windows, extension, linux, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-files"
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          v="${TAG#v}"
          linux="raisesteady-guard_${v}-1_amd64.deb raisesteady-guard_${v}-1_arm64.deb raisesteady-guard-${v}-1.x86_64.rpm raisesteady-guard-${v}-1.aarch64.rpm raisesteady-guard-${v}-linux-amd64.tar.gz raisesteady-guard-${v}-linux-arm64.tar.gz"
          for f in $linux; do [ -f "$f" ] || { echo "missing $f"; exit 1; }; done
          # Android: only when the signing secrets made a signed APK (android job).
          android=""
          if [ -f android-certificate-sha256.txt ]; then
            android="$(ls raisesteady-guard-android-*.apk)"
            fp="$(cat android-certificate-sha256.txt)"
            sha256sum "$android" > "$android.sha256"
            rm android-certificate-sha256.txt
          fi
          # shellcheck disable=SC2086
          sha256sum RaiseSteadyGuardSetup.exe raisesteady-guard-*-chromium.zip raisesteady-guard-*-firefox.zip $linux $android > SHA256SUMS.txt
          cat SHA256SUMS.txt
          home="https://github.com/$GH_REPO"
          {
            echo "RaiseSteady Guard ${v}: free, open-source child-safe browsing for Windows and Linux${android:+, and an app for Android}."
            echo
            echo "**Windows 10 and 11:** download \`RaiseSteadyGuardSetup.exe\` and run it; Windows asks for an administrator."
            echo
            echo "**Linux** (64-bit, with systemd): install the file for your system, then run \`sudo raisesteady-guard setup\`."
            echo "- Ubuntu, Debian, Linux Mint: \`raisesteady-guard_${v}-1_amd64.deb\`, then \`sudo apt install ./raisesteady-guard_${v}-1_amd64.deb\`"
            echo "- Fedora and other RPM systems: \`raisesteady-guard-${v}-1.x86_64.rpm\`, then \`sudo dnf install ./raisesteady-guard-${v}-1.x86_64.rpm\`"
            echo "- Other Linux: \`raisesteady-guard-${v}-linux-amd64.tar.gz\`, unpack it, then \`sudo ./install.sh\`"
            echo "- ARM computers: the files marked arm64 or aarch64."
            echo
            if [ -n "$android" ]; then
              echo "**Android:** \`$android\` (Android 10 or later). Certificate SHA-256: \`$fp\`. Install it on the child's phone or tablet as the [README]($home#android) says (allow \"Install unknown apps\" for your browser or files app)."
            else
              echo "**Android:** the Android app is not in this release yet."
            fi
            echo
            echo "On Linux the browser settings apply to every account on the computer, including the parent's. What it does, its limits and privacy: [README]($home#readme)."
            echo
            if [ "$SIGN" = true ]; then
              echo "**[Code signing policy]($home#code-signing-policy):** Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/)."
            else
              echo "**[Code signing policy]($home#code-signing-policy):** these files are not code-signed yet; free signing through SignPath Foundation is planned. Windows may show \"Windows protected your PC\": click More info, then Run anyway."
            fi
            echo
            echo "Made with AI and provided \"as is\", without any guarantee; support is voluntary and updates are not promised. Read [About this project]($home#about-this-project) before you install."
            echo
            echo "Firefox: the extension is signed by Mozilla, comes with the installer and the Linux packages, and installs by itself. Chrome, Edge and Brave: it installs from their stores once it is published there. The extension zips are the store packages, also for testing."
            echo
            echo "Checksums: SHA256SUMS.txt."
          } > notes.md
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "RaiseSteady Guard ${v}" --notes-file notes.md \
            RaiseSteadyGuardSetup.exe raisesteady-guard-*-chromium.zip raisesteady-guard-*-firefox.zip $linux ${android:+$android $android.sha256} SHA256SUMS.txt
