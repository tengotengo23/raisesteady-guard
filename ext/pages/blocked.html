<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/kit.css">
<link rel="stylesheet" href="pages.css">
<script type="module" src="blocked.js"></script>
</head>
<body>
<main class="bp-main">
  <article class="kg-card bp-card kg-enter" aria-live="polite">
    <div id="art" class="bp-art" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <p id="body" class="kg-muted"></p>
    <p id="site" hidden></p>

    <section id="next" class="bp-next" hidden>
      <h2 id="nextTitle" data-i18n="nextTitle"></h2>
      <div id="tiles"></div>
    </section>
    <p id="bedTip" hidden data-i18n="bedTip"></p>

    <section id="ask" class="bp-ask" hidden>
      <button id="askBtn" class="kg-btn kg-ghost" type="button" aria-expanded="false" aria-controls="askPanel" data-i18n="parentHere"></button>
      <div id="askPanel" hidden>
        <form id="pinForm" class="bp-pin" autocomplete="off" novalidate>
          <label class="kg-label" for="pin" data-i18n="pinLabel"></label>
          <input id="pin" class="kg-input" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="8" autocomplete="off" required>
          <button class="kg-btn" type="submit" data-i18n="pinCheck"></button>
        </form>
        <p id="pinMsg" class="kg-note kg-bad" role="alert" hidden></p>
        <div id="grantBox" hidden>
          <h2 data-i18n="grantTitle"></h2>
          <div id="grants" class="bp-grants"></div>
        </div>
        <p id="grantMsg" class="kg-note kg-good" role="status" hidden></p>
      </div>
      <p id="bedAsk" class="kg-muted" hidden data-i18n="bedAsk"></p>
      <form id="req" class="bp-req" autocomplete="off" novalidate hidden>
        <label class="kg-label" for="reqNote" data-i18n="reqNoteLabel"></label>
        <input id="reqNote" class="kg-input" type="text" maxlength="140" autocomplete="off" spellcheck="true">
        <button id="reqBtn" class="kg-btn" type="submit" data-i18n="askParent"></button>
        <p id="reqMsg" class="kg-note kg-good" role="status" hidden></p>
      </form>
    </section>

    <p class="bp-next"><a id="home" class="kg-link" href="newtab.html" data-i18n="backHome"></a></p>
  </article>
</main>
</body>
</html>
