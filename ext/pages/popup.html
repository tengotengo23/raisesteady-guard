<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="../ui/tokens.css">
<link rel="stylesheet" href="../ui/kit.css">
<link rel="stylesheet" href="pages.css">
<script type="module" src="popup.js"></script>
</head>
<body>
<main class="pp kg-stack">
  <h1 id="name"></h1>
  <section aria-labelledby="ppTime">
    <h2 id="ppTime" class="kg-small kg-muted" data-i18n="timeLeftTitle"></h2>
    <div class="nt-time-row"><b data-i18n="browsing"></b><span id="browseLeft"></span></div>
    <div id="browseMeter" class="kg-meter" role="presentation"><i></i></div>
    <div class="nt-time-row" style="margin-top:12px"><b data-i18n="videos"></b><span id="videoLeft"></span></div>
    <div id="videoMeter" class="kg-meter" role="presentation"><i></i></div>
  </section>
  <section aria-labelledby="ppOn">
    <h2 id="ppOn" class="kg-small kg-muted" data-i18n="whatsOn"></h2>
    <ul id="list" class="pp-list"></ul>
  </section>
  <p id="setup" class="kg-note" hidden data-i18n="setupNeeded"></p>
  <p id="now" class="kg-note" hidden></p>
  <p class="kg-small kg-muted" data-i18n="honest"></p>
  <p id="honestSearches" class="kg-small kg-muted" hidden data-i18n="honestSearches"></p>
  <p class="kg-small kg-muted" data-i18n="privacy"></p>
  <p><a id="parent" class="kg-btn kg-ghost" href="#" target="_blank" rel="noopener" data-i18n="parentLink"></a></p>
</main>
</body>
</html>
